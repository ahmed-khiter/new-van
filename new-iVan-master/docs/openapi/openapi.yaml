openapi: 3.0.3
info:
  title: Swipped API
  version: 1.0.0
  description: |
    ## Introduction
    Unified API documentation for Swipped.

    This document groups endpoints by business domain so API consumers can navigate
    authentication, public discovery, and protected/admin operations more easily.

    ## Base URL
    - Live: `https://dev.swippped.com`
    - Local: `http://localhost:3001`
servers:
  - url: https://dev.swippped.com
    description: Live domain
  - url: http://localhost:3001
    description: Local development
tags:
  - name: Auth
    description: Authentication and account recovery
  - name: Public
    description: Public endpoints used by landing and discovery flows
  - name: Customer
    description: Customer-facing authenticated APIs
  - name: Service Provider
    description: Service provider APIs
  - name: Shop
    description: Shop owner and shop management APIs
  - name: Restaurant
    description: Restaurant and reservation management APIs
  - name: Admin
    description: Protected/admin and operational endpoints
x-tagGroups:
  - name: Authentication
    tags: [Auth]
  - name: Public APIs
    tags: [Public]
  - name: Customer APIs
    tags: [Customer]
  - name: Service Provider APIs
    tags: [Service Provider]
  - name: Shop APIs
    tags: [Shop]
  - name: Restaurant APIs
    tags: [Restaurant]
  - name: Protected APIs
    tags: [Admin]

