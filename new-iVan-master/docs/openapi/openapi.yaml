components:
  schemas:
    GenericSuccessResponse:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
          nullable: true
        data:
          nullable: true
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    ChatIdParam:
      name: chatId
      in: path
      required: true
      schema:
        type: string
    NextauthParam:
      name: nextauth
      in: path
      required: true
      schema:
        type: string
    SearchParam:
      name: search
      in: query
      required: false
      schema:
        type: string
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
